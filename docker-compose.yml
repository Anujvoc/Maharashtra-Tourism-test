version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./.docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

        networks:
            - laravel

    web:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    # =========================
    # ✅ ACTIVE DATABASE (MariaDB 10)
    # =========================
    db:
        image: mariadb:10.11
        container_name: laravel_mariadb
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MARIADB_DATABASE: vocmanindia_rts
            MARIADB_ROOT_PASSWORD: root
            MARIADB_USER: vocmanindia_rts
            MARIADB_PASSWORD: vocmanindia
        volumes:
            - mariadbdata:/var/lib/mysql
        networks:
            - laravel

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel_phpmyadmin
        restart: unless-stopped
        ports:
            - "8082:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: root
        depends_on:
            - db
        networks:
            - laravel

    # =========================
    # ❌ MySQL (COMMENTED)
